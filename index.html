<!DOCTYPE html>
<html lang="uk" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Інтерактивний календар та графік змін для 5 змін (А, Б, В, Г, Д) з нотатками, QR-кодом, зворотним зв'язком у Telegram та офлайн PWA доступом."
    />
    <meta name="keywords" content="графік змін, робочий графік, календар змін, розклад роботи, 5 змін, PWA, застосунок, розклад" />
    
    <!-- Open Graph (Facebook, Viber, Telegram) -->
    <meta property="og:title" content="Графік змін | Мультирічний календар PWA" />
    <meta property="og:description" content="Інтерактивний PWA додаток для ведення графіку робочих змін з можливістю додавання нотаток та офлайн доступом." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://shift-schedule-2026.vercel.app/" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Графік змін | Мультирічний календар PWA" />
    <meta name="twitter:description" content="Інтерактивний PWA додаток для ведення графіку робочих змін." />

    <!-- PWA Settings & Icons -->
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Графік змін" />
    <link rel="apple-touch-icon" href="./icons/icon.svg" />
    <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />

    <title>Графік змін | Мультирічний календар PWA</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL,GRAD,opsz@400,0,0,24" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- App Header -->
    <header class="app-header">
      <div class="header-container">
        <div class="title-group">
          <h1><span class="material-symbols-outlined" style="vertical-align: text-bottom;">bolt</span> Графік змін<span style="font-size: 0.85rem; font-weight: normal; color: var(--text-secondary); margin-left: 8px; vertical-align: middle;">v1.1</span></h1>
          <button id="btnThemeToggle" class="theme-toggle-modern" aria-label="Перемикач теми" title="Змінити тему" role="switch" aria-checked="false">
            <span class="toggle-track">
              <span class="toggle-icon sun"><span class="material-symbols-outlined" style="font-size: 16px;">light_mode</span></span>
              <span class="toggle-icon moon"><span class="material-symbols-outlined" style="font-size: 16px;">dark_mode</span></span>
              <span class="toggle-thumb"></span>
            </span>
          </button>
        </div>

        <div class="controls-bar">
          <!-- Year Selector (Only Arrow Controls) -->
          <div class="year-selector">
            <button id="btnPrevYear" class="btn-nav" title="Попередній рік" aria-label="Попередній рік">◀</button>
            <input type="number" id="yearInput" class="year-display" min="1900" max="2100" value="2026" aria-label="Рік" />
            <button id="btnNextYear" class="btn-nav" title="Наступний рік" aria-label="Наступний рік">▶</button>
          </div>

          <details class="legend-accordion">
            <summary aria-label="Фільтр змін" title="Фільтр змін" style="justify-content: center;"><span class="material-symbols-outlined" style="font-size: 20px;">filter_list</span></summary>
            <section class="toolbar-section">
              <div class="shift-filters" role="group" aria-label="Фільтр змін">
                <button class="btn-filter" data-filter="А">А</button>
                <button class="btn-filter" data-filter="Б">Б</button>
                <button class="btn-filter" data-filter="В">В</button>
                <button class="btn-filter" data-filter="Г">Г</button>
                <button class="btn-filter" data-filter="Д">Д</button>
              </div>
            </section>
          </details>
        </div>
      </div>
    </header>

    <!-- Main Container -->
    <main class="main-container">
      <!-- Calendar Months Grid -->
      <section id="calendarContainer" class="months-grid" aria-label="Календар змін"></section>
    </main>

    <!-- Modal: Mobile Month Calendar Drawer (For Mobile View) -->
    <div id="monthModal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="monthModalTitle">
      <div class="modal-card month-modal-card">
        <div class="drawer-handle"></div>
        <div class="modal-header">
          <div class="month-modal-title-group">
            <h2 id="monthModalTitle" class="modal-title">Місяць</h2>
            <span id="monthModalSubtitle" class="month-meta"></span>
          </div>
          <button id="btnCloseMonthModal" class="btn-close" aria-label="Закрити">&times;</button>
        </div>
        <div class="month-modal-controls">
          <button id="btnPrevMonthModal" class="btn-action btn-month-nav" title="Попередній місяць" aria-label="Попередній місяць"><span class="material-symbols-outlined">chevron_left</span></button>
          <button id="btnNextMonthModal" class="btn-action btn-month-nav" title="Наступний місяць" aria-label="Наступний місяць"><span class="material-symbols-outlined">chevron_right</span></button>
        </div>
        <div class="modal-body month-modal-body">
          <div id="monthModalTableContainer" class="table-wrapper"></div>
        </div>
        <div class="modal-footer month-modal-footer">
          <div class="month-modal-hint">
            <span class="legend-color note-badge" style="display:inline-block; vertical-align:middle; margin-right:6px;"></span>
            <span style="font-size:0.8rem; color:var(--text-secondary);">Натисніть на день, щоб додати нотатку</span>
          </div>
          <button id="btnDoneMonthModal" class="btn-action btn-primary">Готово</button>
        </div>
      </div>
    </div>

    <!-- Modal: Add / Edit Note -->
    <div id="noteModal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="modalDateTitle">
      <div class="modal-card">
        <div class="drawer-handle"></div>
        <div class="modal-header">
          <h2 id="modalDateTitle" class="modal-title">Нотатка до дати</h2>
          <button id="btnCloseNoteModal" class="btn-close" aria-label="Закрити">&times;</button>
        </div>
        <div class="modal-body">
          <div class="form-group">
            <label class="form-label" for="noteStatusSelect">Статус / Відмітка:</label>
            <select id="noteStatusSelect" class="form-select">
              <option value="normal">Зміна</option>
              <option value="✚ Лікарняний">✚ Лікарняний</option>
              <option value="⛱︎ Відпустка">⛱︎ Відпустка</option>
              <option value="✎ Інше">✎ Інше</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label" for="noteTextInput">Текст нотатки:</label>
            <textarea
              id="noteTextInput"
              class="form-textarea"
              rows="4"
              placeholder="Введіть ваш коментар, заміни чи нагадування..."
            ></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button id="btnDeleteNote" class="btn-action">Видалити</button>
          <button id="btnCancelNote" class="btn-action">Скасувати</button>
          <button id="btnSaveNote" class="btn-action btn-primary">Зберегти</button>
        </div>
      </div>
    </div>

    <!-- Modal: All Stored Notes Drawer -->
    <div id="notesListModal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="notesListTitle">
      <div class="modal-card" style="max-width: 650px;">
        <div class="drawer-handle"></div>
        <div class="modal-header">
          <h2 id="notesListTitle" class="modal-title">Всі збережені нотатки</h2>
          <button id="btnCloseNotesListModal" class="btn-close" aria-label="Закрити">&times;</button>
        </div>
        <div class="modal-body">
          <input
            type="text"
            id="notesSearchInput"
            class="form-input"
            placeholder="🔍 Пошук по нотаткам, датам, змінам..."
            aria-label="Пошук нотаток"
          />
          <div id="notesListContainer" class="notes-list-container"></div>
        </div>
      </div>
    </div>

    <!-- Modal: QR Code Share -->
    <div id="qrModal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="qrTitle">
      <div class="modal-card" style="text-align: center; max-width: 440px;">
        <div class="drawer-handle"></div>
        <div class="modal-header">
          <h2 id="qrTitle" class="modal-title">Поділитися графіком</h2>
          <button id="btnCloseQrModal" class="btn-close" aria-label="Закрити">&times;</button>
        </div>
        <div class="modal-body" style="align-items: center;">
          <p style="font-size: 0.9rem; color: var(--text-secondary);">
            Відскануйте QR-код камерою смартфона, щоб відкрити графік змін
          </p>
          <div id="qrContainer" class="qr-container">
            <img id="qrImage" src="" alt="QR Code" style="width: 220px; height: 220px; border-radius: 12px; border: 2px solid var(--border-color);" />
          </div>

        </div>
        <div class="modal-footer" style="justify-content: center; width: 100%;">
          <button id="btnCopyUrl" class="btn-action">Копіювати посилання</button>
          <button id="btnShareNative" class="btn-action btn-primary">Поділитися</button>
        </div>
      </div>
    </div>

    <!-- Modal: Feedback -->
    <div id="feedbackModal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="feedbackTitle">
      <div class="modal-card" style="max-width: 480px;">
        <div class="drawer-handle"></div>
        <div class="modal-header">
          <h2 id="feedbackTitle" class="modal-title">Зворотній зв'язок</h2>
          <button id="btnCloseFeedbackModal" class="btn-close" aria-label="Закрити">&times;</button>
        </div>
        <div class="modal-body">
          <div class="form-group">
            <label class="form-label">Ваша оцінка додатку:</label>
            <div class="star-rating" id="starRating" role="radiogroup" aria-label="Оцінка">
              <span data-star="1" role="radio" aria-checked="false" aria-label="1 зірка">★</span>
              <span data-star="2" role="radio" aria-checked="false" aria-label="2 зірки">★</span>
              <span data-star="3" role="radio" aria-checked="false" aria-label="3 зірки">★</span>
              <span data-star="4" role="radio" aria-checked="false" aria-label="4 зірки">★</span>
              <span data-star="5" class="active" role="radio" aria-checked="true" aria-label="5 зірок">★</span>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="feedbackContact">Контакт для зв'язку (необов'язково):</label>
            <input type="text" id="feedbackContact" class="form-input" placeholder="example@email.com або @username" />
          </div>
          <div class="form-group">
            <label class="form-label" for="feedbackText">Повідомлення:</label>
            <textarea id="feedbackText" class="form-textarea" rows="4" placeholder="Опишіть ваші враження, пропозиції або зауваження..."></textarea>
          </div>


        </div>
        <div class="modal-footer">
          <button id="btnCancelFeedback" class="btn-action">Скасувати</button>
          <button id="btnSubmitFeedback" class="btn-action btn-primary">Надіслати</button>
        </div>
      </div>
    </div>

    <!-- Notification Toast Container -->
    <div id="toastNotification" class="toast-notification" role="status" aria-live="polite"></div>

    <!-- Bottom Navigation Menu -->
    <nav class="action-buttons" role="navigation" aria-label="Головне меню">
      <button class="btn-action btn-notes-list"><span class="material-symbols-outlined nav-icon">edit_note</span><span class="nav-text">Нотатки</span></button>
      <button class="btn-action btn-qr-code"><span class="material-symbols-outlined nav-icon">qr_code_scanner</span><span class="nav-text">QR-код</span></button>
      <button class="btn-action btn-feedback"><span class="material-symbols-outlined nav-icon">chat</span><span class="nav-text">Відгук</span></button>
    </nav>

    <script src="app.js"></script>
  </body>
</html>
