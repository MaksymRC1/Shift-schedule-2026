<!DOCTYPE html>
<html lang="uk" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta
      name="description"
      content="Інтерактивний календар та графік змін для 5 змін (А, Б, В, Г, Д) з нотатками, QR-кодом, зворотним зв'язком та офлайн PWA доступом."
    />

    <!-- PWA Settings & Icons -->
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Графік змін" />
    <link rel="apple-touch-icon" href="./icons/icon.svg" />
    <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />

    <title>Графік змін | Мультирічний календар PWA</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- App Header -->
    <header class="app-header">
      <div class="header-container">
        <div class="title-group">
          <h1>⚡ Графік змін</h1>
        </div>

        <div class="controls-bar">
          <!-- Year Selector -->
          <div class="year-selector">
            <button id="btnPrevYear" class="btn-nav" title="Попередній рік">◀</button>
            <input type="number" id="yearInput" class="year-display" min="1900" max="2100" value="2026" />
            <button id="btnNextYear" class="btn-nav" title="Наступний рік">▶</button>
          </div>

          <!-- Quick Year Selector -->
          <div class="quick-years">
            <button class="btn-year" data-year="2025">2025</button>
            <button class="btn-year active" data-year="2026">2026</button>
            <button class="btn-year" data-year="2027">2027</button>
            <button class="btn-year" data-year="2028">2028</button>
            <button class="btn-year" data-year="2029">2029</button>
            <button class="btn-year" data-year="2030">2030</button>
          </div>

          <!-- Action Buttons -->
          <div class="action-buttons">
            <button id="btnQrCode" class="btn-action">📲 QR-код</button>
            <button id="btnFeedback" class="btn-action">💬 Відгук</button>
            <button id="btnNotesList" class="btn-action">📝 Нотатки</button>
            <button id="btnThemeToggle" class="btn-action">☀️ Тема</button>
            <button id="btnPrint" class="btn-action btn-primary">🖨️ Друк / PDF</button>
          </div>
        </div>
      </div>
    </header>

    <!-- Main Container -->
    <main class="main-container">
      <!-- Toolbar Section: Legend & Filters -->
      <section class="toolbar-section">
        <div class="legend">
          <div class="legend-item">
            <span class="legend-color shift-1">1</span> Зміна 1 (08:00 - 16:00)
          </div>
          <div class="legend-item">
            <span class="legend-color shift-2">2</span> Зміна 2 (16:00 - 00:00)
          </div>
          <div class="legend-item">
            <span class="legend-color shift-3">3</span> Зміна 3 (00:00 - 08:00)
          </div>
          <div class="legend-item">
            <span class="legend-color shift-off"></span> Вихідний
          </div>
          <div class="legend-item">
            <span class="legend-color weekend">Сб</span> Вихідні дні
          </div>
          <div class="legend-item">
            <span class="legend-color note-badge"></span> Нотатка
          </div>
        </div>

        <div class="shift-filters">
          <span class="filter-label">Зміна:</span>
          <button class="btn-filter active" data-filter="all">Всі</button>
          <button class="btn-filter" data-filter="А">А</button>
          <button class="btn-filter" data-filter="Б">Б</button>
          <button class="btn-filter" data-filter="В">В</button>
          <button class="btn-filter" data-filter="Г">Г</button>
          <button class="btn-filter" data-filter="Д">Д</button>
        </div>
      </section>

      <!-- Statistics Summary Grid -->
      <section id="statsGrid" class="stats-grid"></section>

      <!-- Calendar Months Grid -->
      <section id="calendarContainer" class="months-grid"></section>
    </main>

    <!-- Modal: Add / Edit Note -->
    <div id="noteModal" class="modal-backdrop">
      <div class="modal-card">
        <div class="modal-header">
          <h2 id="modalDateTitle" class="modal-title">Нотатка до дати</h2>
          <button id="btnCloseNoteModal" class="btn-close">&times;</button>
        </div>
        <div class="modal-body">
          <div class="form-group">
            <label class="form-label" for="noteStatusSelect">Статус / Відмітка:</label>
            <select id="noteStatusSelect" class="form-select">
              <option value="normal">Звичайний графік</option>
              <option value="🏖️ Відпустка">🏖️ Відпустка</option>
              <option value="🤒 Лікарняний">🤒 Лікарняний</option>
              <option value="⚡ Понаднормово">⚡ Понаднормово</option>
              <option value="🔄 Заміна">🔄 Заміна</option>
              <option value="📝 Особисте">📝 Особисте</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label" for="noteTextInput">Текст нотатки:</label>
            <textarea
              id="noteTextInput"
              class="form-textarea"
              rows="4"
              placeholder="Введіть ваш коментар, заміни чи нагадування..."
            ></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button id="btnDeleteNote" class="btn-action" style="color: #ef4444; border-color: rgba(239,68,68,0.3);">Видалити</button>
          <button id="btnCancelNote" class="btn-action">Скасувати</button>
          <button id="btnSaveNote" class="btn-action btn-primary">Зберегти</button>
        </div>
      </div>
    </div>

    <!-- Modal: All Stored Notes Drawer -->
    <div id="notesListModal" class="modal-backdrop">
      <div class="modal-card" style="max-width: 650px;">
        <div class="modal-header">
          <h2 class="modal-title">📋 Всі збережені нотатки</h2>
          <button id="btnCloseNotesListModal" class="btn-close">&times;</button>
        </div>
        <div class="modal-body">
          <input
            type="text"
            id="notesSearchInput"
            class="form-input"
            placeholder="🔍 Пошук по нотаткам, датам, змінам..."
          />
          <div id="notesListContainer" class="notes-list-container"></div>
        </div>
      </div>
    </div>

    <!-- Modal: QR Code Share -->
    <div id="qrModal" class="modal-backdrop">
      <div class="modal-card" style="text-align: center; max-width: 440px;">
        <div class="modal-header">
          <h2 class="modal-title">📲 Поділитися графіком</h2>
          <button id="btnCloseQrModal" class="btn-close">&times;</button>
        </div>
        <div class="modal-body" style="align-items: center;">
          <p style="font-size: 0.9rem; color: var(--text-secondary);">
            Відскануйте QR-код камерою смартфона, щоб відкрити графік змін
          </p>
          <div id="qrContainer" class="qr-container">
            <img id="qrImage" src="" alt="QR Code" style="width: 220px; height: 220px; border-radius: 12px; border: 2px solid var(--border-color);" />
          </div>
          <div class="form-group" style="width: 100%;">
            <input type="text" id="qrUrlInput" class="form-input" readonly style="text-align: center; font-size: 0.85rem;" />
          </div>
        </div>
        <div class="modal-footer" style="justify-content: center; width: 100%;">
          <button id="btnCopyUrl" class="btn-action">📋 Копіювати посилання</button>
          <button id="btnShareNative" class="btn-action btn-primary">📤 Поділитися</button>
        </div>
      </div>
    </div>

    <!-- Modal: Feedback -->
    <div id="feedbackModal" class="modal-backdrop">
      <div class="modal-card" style="max-width: 480px;">
        <div class="modal-header">
          <h2 class="modal-title">💬 Зворотній зв'язок</h2>
          <button id="btnCloseFeedbackModal" class="btn-close">&times;</button>
        </div>
        <div class="modal-body">
          <div class="form-group">
            <label class="form-label">Ваша оцінка додатку:</label>
            <div class="star-rating" id="starRating">
              <span data-star="1">★</span>
              <span data-star="2">★</span>
              <span data-star="3">★</span>
              <span data-star="4">★</span>
              <span data-star="5" class="active">★</span>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label" for="feedbackCategory">Категорія:</label>
            <select id="feedbackCategory" class="form-select">
              <option value="Пропозиція">💡 Пропозиція покращення</option>
              <option value="Помилка">🐛 Повідомити про помилку</option>
              <option value="Подяка">❤️ Подяка</option>
              <option value="Інше">❓ Інше питання</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label" for="feedbackContact">Ваш контакт / E-mail (необов'язково):</label>
            <input type="text" id="feedbackContact" class="form-input" placeholder="example@email.com або @telegram" />
          </div>
          <div class="form-group">
            <label class="form-label" for="feedbackText">Повідомлення:</label>
            <textarea id="feedbackText" class="form-textarea" rows="4" placeholder="Опишіть ваші враження, пропозиції або зауваження..."></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button id="btnCancelFeedback" class="btn-action">Скасувати</button>
          <button id="btnSubmitFeedback" class="btn-action btn-primary">Надіслати відгук</button>
        </div>
      </div>
    </div>

    <!-- Notification Toast Container -->
    <div id="toastNotification" class="toast-notification"></div>

    <script src="app.js"></script>
  </body>
</html>
