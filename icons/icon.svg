  <rect x="160" y="96" width="24" height="64" rx="12" fill="#f8fafc"/>
  <rect x="328" y="96" width="24" height="64" rx="12" fill="#f8fafc"/>

  <!-- Grid Cells -->
  <rect x="136" y="240" width="64" height="48" rx="12" fill="#fef08a"/>
  <rect x="224" y="240" width="64" height="48" rx="12" fill="#bae6fd"/>
  <rect x="312" y="240" width="64" height="48" rx="12" fill="#bbf7d0"/>

  <rect x="136" y="312" width="64" height="48" rx="12" fill="#bae6fd"/>
  <rect x="224" y="312" width="64" height="48" rx="12" fill="#bbf7d0"/>
  <rect x="312" y="312" width="64" height="48" rx="12" fill="#fef08a"/>

  <!-- Lightning Bolt Badge -->
  <circle cx="384" cy="384" r="56" fill="#0f172a" stroke="url(#accentGrad)" stroke-width="6"/>
  <path d="M 388 344 L 356 392 L 384 392 L 380 424 L 412 376 L 384 376 Z" fill="url(#boltGrad)"/>
